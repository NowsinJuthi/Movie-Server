# Drop into aaPanel so /api/v1/stream/ never skips the Next.js player proxy.
# Web site:   /www/server/panel/vhost/nginx/proxy/movies.amarpin.com/0-amarpin-stream.conf
# (Also copied to extension/movies.amarpin.com/)
#
# Longer prefix ^~ /api/v1/stream/ wins over aaPanel's ^~ /api/v1/ → :4000.

location ^~ /api/v1/stream/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_buffering off;
    proxy_request_buffering off;
}
