# =============================================================================
# aaPanel → Website → movies.amarpin.com (Next.js web + /api/v1 proxy to API)
# Paste into the site nginx config (keep SSL block from aaPanel).
# IMPORTANT: location ^~ /api/v1/ MUST be before location /
# =============================================================================

server {
    listen 80;
    listen 443 ssl http2;
    server_name movies.amarpin.com www.movies.amarpin.com;

    # aaPanel SSL (Let's Encrypt):
    # ssl_certificate     /www/server/panel/vhost/cert/movies.amarpin.com/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/movies.amarpin.com/privkey.pem;

    # Large enough for Admin → Samba video uploads (or set 0 for unlimited).
    # Uploads use POST /api/smb-upload/:id (Next.js streams to API), not /api/v1/ rewrite.
    client_max_body_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 60s;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Samba video uploads — must allow large bodies (John Wick–size MKV/MP4).
    location ^~ /api/smb-upload/ {
        client_max_body_size 0;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API — ^~ stops other locations (incl. aaPanel proxy includes) from stealing /api/v1
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Hashed build assets — safe to cache long-term (new deploy = new filenames).
    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # HTML/RSC must not be cached across deploys (stale HTML + new chunks = blank/flashing UI).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://movies.api.amarpin.com wss://movies.api.amarpin.com ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    access_log /www/wwwlogs/movies.amarpin.com.access.log;
    error_log /www/wwwlogs/movies.amarpin.com.error.log;
}
