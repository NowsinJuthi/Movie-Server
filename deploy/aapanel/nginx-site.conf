# =============================================================================
# aaPanel → Website → movies.amarpin.com → Config / Reverse Proxy
# Paste into the site nginx config (keep SSL server block from aaPanel).
# Replace movies.amarpin.com if needed. Upstream targets are localhost Docker binds.
# =============================================================================

# --- HTTP → HTTPS (aaPanel usually manages this) ---
# server {
#     listen 80;
#     server_name movies.amarpin.com www.movies.amarpin.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    listen 443 ssl http2;
    server_name movies.amarpin.com www.movies.amarpin.com;

    # aaPanel SSL paths (auto-filled when you enable Let's Encrypt):
    # ssl_certificate    /www/server/panel/vhost/cert/movies.amarpin.com/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/movies.amarpin.com/privkey.pem;

    client_max_body_size 200m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 60s;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API + webhooks + media artwork
    location /api/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Socket.IO (realtime)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Next.js web app
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /www/wwwlogs/movies.amarpin.com.access.log;
    error_log /www/wwwlogs/movies.amarpin.com.error.log;
}
