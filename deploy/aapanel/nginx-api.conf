# =============================================================================
# aaPanel → Website → movies.api.amarpin.com (NestJS API)
# Paste into the API site nginx config (keep SSL block from aaPanel).
# =============================================================================

server {
    listen 80;
    listen 443 ssl http2;
    server_name movies.api.amarpin.com;

    # aaPanel SSL (Let's Encrypt):
    # ssl_certificate     /www/server/panel/vhost/cert/movies.api.amarpin.com/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/movies.api.amarpin.com/privkey.pem;

    client_max_body_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 60s;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    access_log /www/wwwlogs/movies.api.amarpin.com.access.log;
    error_log /www/wwwlogs/movies.api.amarpin.com.error.log;
}
